name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Build and validate curated Pages artifact
        run: python3 scripts/build_pages_artifact.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - uses: actions/deploy-pages@v5
        id: deployment
