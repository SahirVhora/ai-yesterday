name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m py_compile scripts/collect_ai_news.py
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('data').rglob('*.json'):
              json.loads(path.read_text())
          PY
